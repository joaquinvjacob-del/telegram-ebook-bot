services:
  - type: web
    name: telegram-ebook-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: REQUIRE_ACCESS_CODE
        value: "true"
